<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>04. 내용 입력</title>
    <style>
      /*밑줄 삭제*/
      a {
        text-decoration: none;
      }
      /*방문 전*/
      a:link {
        color: black;
      }
      /*방문했던*/
      a:visited {
        color: blue;
      }
      /*쥐 올린*/
      a:hover {
        color: green;
      }
      /*클릭 순간*/
      a:active {
        color: red;
      }
      /*변화 ㄴ: 전 = 했던*/
      a:link {
        color: black; 
      }
      a:visited {
        color: black;
      }
    </style>
  </head>
  <body>
    <h1>목차</h1>
    <ol>
      <li><a href=index_text.html>문자 입력</a></li>
      <li>목록 만들기</li>
      <li>표 만들기</li>
      <li>이미지 삽입</li>
      <li>오디오, 비디오 삽입</li>
      <li>하이퍼링크 삽입</li>
    </ol>
  </body>
</html>
