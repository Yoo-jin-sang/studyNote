<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>실제</title>
  </head>
  <body>
    <ul>
      <li>요소를 무리로
        <form>
          <fieldset>
            <legend>상품 선택</legend>
          </fieldset>
          <fieldset>
            <legend>배송 정보</legend>
          </fieldset>
        </form>
        <figure>
            <img src="img/filedset.png" alt="요소를 무리">
            <figcaption>요소를 무리로</figcaption>
        </figure>        
      </li>
      <li>요소에 상표를
        <ul>
          <li>통합<br>
          <form>
            <label>아이디(6자 이상)<input type="text"></label>
          </form>
          </li>
          <hr>
          <li>분리<br>
          <form>
            <label for="신분명">아이디(6자 이상)</label>
            <input id="신분명">
          </form>
          <figure>
            <img src="img/label.png" alt="요소에 상표">
            <figcaption>요소에 상표를</figcaption>
          </figure>          
          </li>
        </ul>
      </li>
    </ul>
  </body>
</html>
