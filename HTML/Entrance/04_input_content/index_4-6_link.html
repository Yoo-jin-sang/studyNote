<!DOCTYPE html>
<html lang="k0">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>04. 내용 입력</title>
    </head>
    <body>
        <h1>04-6. 과잉고리</h1>
        <ol>
          <li>목차
            <ul>
              <li>꼬리표</li>
              <li>한 페이지 안</li>
            </ul>
          </li>
          <li>본문
            <ul>
              <li>꼬리표
                - &lt;에 과참조="경로"&gt;문자 / 인상&lt/에&gt;
                <ul>
                  <li>문자
                    - &lt;에 과참조="경로"&gt;문자&lt/에&gt;
                  </li>
                  <li>인상
                    - &lt;에 과참조="경로"&gt;&lt;아엠지 원천="경로" 대안="글자"&gt;&lt/에&gt;
                  </li>
                  <li>새탭
                    - &lt;에 과참조="경로" 표적="_빈칸"&gt;
                  </li>
                </ul>
              </li>
              <li>한 페이지 안
                - &lt;요소 신분="가"&gt;문자 / 이미지&lt;/요소&gt;
                - &lt;에 과참조="이름"&gt;링크&lt/에&gt;
              </li>
            </ul>
          </li>
          <li>실제</li>
        </ol>
    </body>
</html>
