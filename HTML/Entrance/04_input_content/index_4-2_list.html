<!DOCTYPE html>
<html lang="k0">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>04. 내용 입력</title>
    </head>
    <body>
        <h1>04-2. 목록</h1>
        <ol>
          <li>목차
            <ul>
              <li>순서 ㅇ</li>
              <li>순서 ㄴ</li>
              <li>설명</li>
            </ul>
          </li>
          <li>본문
            <ul>
              <li>순서 ㅇ
                - 오엘
                - 엘아
              </li>
              <li>순서 ㄴ
                - 유엘
                - 엘아
              </li>
              <li>설명
                - 디엘
                - 디티: 이름
                - 디디: 값
              </li>
            </ul>
          </li>
          <li>실제
            <dl>
              <dt>선물용</dt>
              <dd>소과</dd>
              <dd>대과</dd>
            </dl>
          </li>
        </ol>
    </body>
</html>
