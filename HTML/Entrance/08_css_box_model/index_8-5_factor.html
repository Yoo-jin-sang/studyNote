<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8">

    <title>08. CSS 박스 모델</title>
  </head>
  <body>
    <h1>08-5. 웹 요소의 위치</h1>
    <ol>
      <li>목차
        <ul>
          <li>위치 지정</li>
          <li>배치 방법</li>
        </ul>
      </li>
      <li>본문
        <ul>
          <li>위치 지정
            <ul>
              <li>왼</li>
              <li>오</li>
              <li>꼭</li>
              <li>바</li>
            </ul>
          </li>
          <li>배치 방법
            <ul>
              <li>정적
                - 문서 흐름
              </li>
              <li>친척
                - 문서 흐름
                - 위치 지정
              </li>
              <li>절대
                - 친척 상위 요소 기준
              </li>
              <li>고정된
                - 검색자 창 기준
              </li>
            </ul>
          </li>
        </ul>
      </li>
      <li>실제</li>
    </ol>
  </body>
